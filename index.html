<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Liberauto San Luis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
        body{
            min-height:100vh;
            background-image:url("Escuela Liberauto.png");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .overlay{
            background:rgba(0,0,0,0.65);
            width:100%;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .content{
            max-width:600px;
            text-align:center;
            color:white;
        }
        h1{font-size:42px;margin-bottom:10px}
        h2{font-size:22px;font-weight:normal;margin-bottom:25px;color:#f1f1f1}
        p{font-size:18px;line-height:1.5;margin-bottom:30px}
        .btn{
            display:inline-block;
            background:#ffcc00;
            color:black;
            text-decoration:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:8px;
            font-weight:bold;
            transition:transform .2s,background .2s;
        }
        .btn:hover{background:#ffd633;transform:scale(1.05)}
        @media(max-width:600px){
            h1{font-size:32px}
            h2{font-size:18px}
            p{font-size:16px}
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="content">
            <h1>LIBERAUTO SAN LUIS</h1>
            <h2>Escuela de conducción</h2>
            <p>
                Aprendé a manejar de forma segura y confiable.<br>
                Clases personalizadas para principiantes y conductores con experiencia.
            </p>
            <a class="btn" href="https://wa.me/5491132905738" target="_blank">
                📲 Contactar por WhatsApp
            </a>
        </div>
    </div>
</body>
</html>
